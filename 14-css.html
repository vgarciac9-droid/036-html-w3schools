<!DOCTYPE html>
<html>

<head>
    <title>Lección 14 - CSS</title>

    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }

        p {
            color: black;
            font-size: 18px;
        }

        .importante {
            color: red;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <h1>Uso de CSS</h1>

    <p>
        CSS permite cambiar la apariencia de una página web.
    </p>

    <p class="importante">
        Este texto utiliza una clase CSS.
    </p>

</body>

</html>
