<!DOCTYPE html>
<html>

<head>

    <title>Lección 28 - Layout</title>

    <style>

        header {
            background-color: lightblue;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: lightgray;
            padding: 10px;
        }

        section {
            padding: 20px;
        }

        footer {
            background-color: lightblue;
            text-align: center;
            padding: 10px;
        }

    </style>

</head>

<body>

    <header>
        <h1>Mi Sitio Web</h1>
    </header>

    <nav>
        Inicio | Nosotros | Contacto
    </nav>

    <section>
        <h2>Contenido Principal</h2>
        <p>Este es un ejemplo sencillo de un layout.</p>
    </section>

    <footer>
        © 2026 Mi Página Web
    </footer>

</body>

</html>
