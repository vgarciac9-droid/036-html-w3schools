<!DOCTYPE html>
<html>

<head>
    <title>Lección 18 - Tables</title>

    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>

</head>

<body>

    <h1>Tabla de estudiantes</h1>

    <table>

        <tr>
            <th>Nombre</th>
            <th>Carrera</th>
            <th>Semestre</th>
        </tr>

        <tr>
            <td>Viviana</td>
            <td>Ingeniería en Sistemas</td>
            <td>Octavo</td>
        </tr>

        <tr>
            <td>Kimberly</td>
            <td>Enfermeria</td>
            <td>Cuarto</td>
        </tr>

        <tr>
            <td>Katerin</td>
            <td>Ingeniería en Sistemas</td>
            <td>Octavo</td>
        </tr>

    </table>

</body>

</html>
